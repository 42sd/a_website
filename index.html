<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="A small arcade hub to load local HTML game packages" />
  <title>GameHub</title>

  <style>
    :root{
      --bg:#0b0d10;
      --panel:#161920;
      --panel-contrast:#232733;
      --muted:#4b5263;
      --accent:#1c2029;
      --text:#ffffff;
      --radius:10px;
      --max-width:1200px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial;
      color:var(--text);
      background: linear-gradient(180deg,#05060a 0%, #081018 100%);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      flex-direction:column;
    }

    header{
      position:sticky;
      top:0;
      z-index:1000;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:14px 20px;
      background:rgba(22,25,32,0.9);
      border-bottom:1px solid var(--panel-contrast);
      backdrop-filter: blur(6px);
      flex-shrink:0;
    }

    .header-left{display:flex;align-items:center;gap:18px}
    .site-logo-brand{
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      user-select:none;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .search-engine-box{position:relative;display:flex;align-items:center}
    .search-svg-icon{position:absolute;left:12px;color:var(--muted);pointer-events:none;font-size:14px}
    .search-field-input{
      padding:10px 14px 10px 38px;
      background:#0f1115;
      border:1px solid var(--panel-contrast);
      color:var(--text);
      border-radius:8px;
      font-weight:600;
      font-size:13px;
      width:260px;
      outline:none;
    }
    .search-field-input:focus{box-shadow:0 0 0 3px rgba(100,120,255,0.06);}

    main{
      flex:1;
      display:flex;
      flex-direction:column;
      max-width:var(--max-width);
      margin:0 auto;
      padding:0 16px;
      width:100%;
      overflow-y:auto;
    }

    .stage-viewport-area{
      display:none;
      width:100%;
      height:100%;
    }
    .stage-viewport-area.active{
      display:flex;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:9998;
      margin:0;
      padding:0;
    }

    .viewport-wrapper{
      background:#000;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 20px 45px rgba(0,0,0,0.6);
      border:1px solid var(--panel);
      margin:20px auto;
      max-width:90%;
      display:flex;
      flex-direction:column;
    }
    .stage-viewport-area.active .viewport-wrapper{
      border-radius:0;
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      max-width:100%;
      box-shadow:none;
      border:none;
    }
    .viewport-wrapper.fullscreen-active{
      position:fixed;
      top:0;
      left:0;
      width:100vw;
      height:100vh;
      border-radius:0;
      margin:0;
      box-shadow:none;
      border:none;
      z-index:9999;
    }
    
    #runtime-canvas-injection-point{
      width:100%;
      flex:1;
      background:#060709;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    iframe.game-viewport{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#000;
    }

    .idle-splash-screen{
      color:var(--muted);
      padding:36px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.06em;
      text-align:center;
    }

    .viewport-meta-drawer{
      background:#060709;
      border-top:1px solid var(--panel);
      padding:6px 12px;
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      flex-shrink:0;
    }
    .stage-viewport-area.active .viewport-meta-drawer{
      display:flex;
    }
    .viewport-meta-drawer[hidden]{
      display:none;
    }
    .meta-left{display:flex;gap:8px;align-items:center}
    .meta-avatar-badge{
      font-size:18px;
      width:32px;height:32px;
      background:var(--panel);
      border:1px solid var(--panel-contrast);
      border-radius:6px;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
    }
    .meta-text-block h3{margin:0;font-size:13px}
    .meta-text-block p{margin:2px 0 0;font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700}
    
    .meta-actions{
      display:flex;
      gap:6px;
      align-items:center;
      flex-shrink:0;
    }

    .action-button{
      appearance:none;
      background:none;
      border:none;
      color:var(--text);
      font-size:24px;
      cursor:pointer;
      padding:4px 6px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform 0.2s ease;
      user-select:none;
      flex-shrink:0;
    }
    .action-button:hover{
      transform:scale(1.1);
    }
    .action-button:active{
      transform:scale(0.95);
    }
    .action-button#back-button{
      font-size:32px;
    }

    .compendium-dashboard-matrix{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:18px;
      margin:28px auto 60px;
    }

    .game-directory-card{
      appearance:none;
      background:var(--panel);
      color:var(--text);
      border-radius:var(--radius);
      padding:0;
      text-align:left;
      overflow:hidden;
      cursor:pointer;
      border:1px solid var(--panel-contrast);
      transition:transform .16s ease,background .12s;
      display:flex;
      flex-direction:column;
      align-items:stretch;
      min-height:150px;
    }
    .game-directory-card:focus{outline:3px solid rgba(100,120,255,0.08)}
    .game-directory-card:hover{transform:translateY(-4px);background:var(--accent);border-color:#2d3345}

    .game-card-thumbnail-box{
      height:120px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:44px;
      background:linear-gradient(135deg,#1c2029 0%,#0f1115 100%);
    }
    .game-directory-card-content{padding:12px 14px;flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:6px}
    .game-directory-card h3{margin:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
    .game-directory-card p{margin:0;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}

    @media (max-width:680px){
      .search-field-input{width:160px}
      iframe.game-viewport{height:420px}
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="site-logo-brand" id="brand" role="button" tabindex="0" title="Reload game list">A game website</div>
    </div>

    <div class="search-engine-box" role="search" aria-label="Search games">
      <span class="search-svg-icon" aria-hidden="true">🔍</span>
      <input id="directory-search-input" class="search-field-input" type="search" placeholder="Search games (title or category)" aria-label="Search games" />
    </div>
  </header>

  <main>
    <section class="stage-viewport-area" id="viewport-stage">
      <div class="viewport-wrapper" aria-live="polite">
        <div id="runtime-canvas-injection-point">
          <div class="idle-splash-screen">Idk what to put here</div>
        </div>

        <div class="viewport-meta-drawer" id="runtime-metadata-drawer" aria-hidden="true" hidden>
          <div class="meta-left">
            <div class="meta-avatar-badge" id="live-card-emoji" aria-hidden="true">🎮</div>
            <div class="meta-text-block">
              <h3 id="live-card-title">Game Core</h3>
            </div>
          </div>
          <div class="meta-actions">
            <button class="action-button" id="open-new-tab-button" title="Open in new tab" aria-label="Open in new tab">✚</button>
            <button class="action-button" id="back-button" title="Back to game list" aria-label="Back to game list">➜</button>
          </div>
        </div>
      </div>
    </section>

    <section id="game-list-section">
      <div class="compendium-dashboard-matrix" id="directory-cards-grid" aria-live="polite">
        <!-- Cards use data attributes and are wired up by JS -->
        <button class="game-directory-card" data-src="./slope/index.html" data-title="Slope" data-category="Local Package" data-glyph="🔴" aria-label="Launch Slope">
          <div class="game-card-thumbnail-box" aria-hidden="true">🔴</div>
          <div class="game-directory-card-content">
            <h3>Slope</h3>
          </div>
        </button>

        <button class="game-directory-card" data-src="./drive-mad/index.html" data-title="Drive Mad" data-category="Local Package" data-glyph="🏎️" aria-label="Launch Drive Mad">
          <div class="game-card-thumbnail-box" aria-hidden="true">🏎️</div>
          <div class="game-directory-card-content">
            <h3>Drive Mad</h3>
          </div>
        </button>

        <button class="game-directory-card" data-src="./polytrack/index.html" data-title="Polytrack" data-category="Local Package" data-glyph="🏎️" aria-label="Launch Polytrack">
          <div class="game-card-thumbnail-box" aria-hidden="true">🏎️</div>
          <div class="game-directory-card-content">
            <h3>Polytrack</h3>
          </div>
        </button>

        <button class="game-directory-card" data-src="./level-devil/index.html" data-title="Level Devil" data-category="Local Package" data-glyph="😈" aria-label="Launch Level Devil">
          <div class="game-card-thumbnail-box" aria-hidden="true">😈</div>
          <div class="game-directory-card-content">
            <h3>Level Devil</h3>
          </div>
        </button>
        
      </div>
    </section>
  </main>

  <script>
    // Behavior separated from markup
    (function(){
      const grid = document.getElementById('directory-cards-grid');
      const searchInput = document.getElementById('directory-search-input');
      const injectionPoint = document.getElementById('runtime-canvas-injection-point');
      const metaDrawer = document.getElementById('runtime-metadata-drawer');
      const liveTitle = document.getElementById('live-card-title');
      const liveEmoji = document.getElementById('live-card-emoji');
      const backButton = document.getElementById('back-button');
      const openNewTabButton = document.getElementById('open-new-tab-button');
      const viewportWrapper = document.querySelector('.viewport-wrapper');
      const viewportStage = document.getElementById('viewport-stage');
      const gameListSection = document.getElementById('game-list-section');

      let currentGameSrc = null;

      // Debounce helper
      function debounce(fn, wait){
        let t;
        return function(...args){
          clearTimeout(t);
          t = setTimeout(()=>fn.apply(this,args), wait);
        };
      }

      // Deploy sandboxed iframe
      function deployApplication(sourceUrl, titleName, thumbnailGlyph){
        // create sandboxed iframe for safety
        const iframe = document.createElement('iframe');
        iframe.className = 'game-viewport';
        iframe.title = 'Game: ' + titleName;
        iframe.src = sourceUrl;
        iframe.loading = 'lazy';
        // sandbox: keep scripts but isolate origin where possible; tune for your needs
        iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-presentation';
        // allow fullscreen/autoplay if games require it
        iframe.allow = 'fullscreen; autoplay';
        // inject
        injectionPoint.innerHTML = '';
        injectionPoint.appendChild(iframe);

        // update metadata
        liveTitle.textContent = titleName;
        liveEmoji.textContent = thumbnailGlyph || '🎮';
        currentGameSrc = sourceUrl;

        // Show metadata drawer with back button
        metaDrawer.hidden = false;
        metaDrawer.setAttribute('aria-hidden','false');

        // Show viewport stage
        viewportStage.classList.add('active');
        gameListSection.style.display = 'none';

        // remember last played
        try { localStorage.setItem('gamehub.last', JSON.stringify({src:sourceUrl, title:titleName, glyph:thumbnailGlyph})); } catch(e){/* ignore */}
      }

      // Close / unload current game
      function closeRuntime(){
        injectionPoint.innerHTML = '<div class="idle-splash-screen">Select an arcade game package below…</div>';
        metaDrawer.hidden = true;
        metaDrawer.setAttribute('aria-hidden','true');
        liveTitle.textContent = 'Game Core';
        liveEmoji.textContent = '🎮';
        currentGameSrc = null;
        viewportStage.classList.remove('active');
        gameListSection.style.display = '';
        try { localStorage.removeItem('gamehub.last'); } catch(e){}
      }

      // Open game in new tab
      function openInNewTab(){
        if (currentGameSrc) {
          window.open(currentGameSrc, '_blank');
        }
      }

      // Wire up grid buttons (click & keyboard)
      grid.querySelectorAll('.game-directory-card').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const src = btn.getAttribute('data-src');
          const title = btn.getAttribute('data-title') || btn.querySelector('h3')?.innerText || 'Game';
          const glyph = btn.getAttribute('data-glyph') || '🎮';
          deployApplication(src, title, glyph);
        });
        // space/enter already activate <button>, so additional keyboard handler not required
      });

      // Search/filter (title and category)
      function doFilter(){
        const q = (searchInput.value || '').trim().toLowerCase();
        grid.querySelectorAll('.game-directory-card').forEach(btn=>{
          const title = (btn.getAttribute('data-title') || '').toLowerCase();
          const category = (btn.getAttribute('data-category') || '').toLowerCase();
          const matches = !q || title.includes(q) || category.includes(q);
          btn.style.display = matches ? '' : 'none';
        });
      }
      const debouncedFilter = debounce(doFilter, 180);
      searchInput.addEventListener('input', debouncedFilter);

      // Back button
      backButton.addEventListener('click', closeRuntime);

      // Open in new tab button
      openNewTabButton.addEventListener('click', openInNewTab);

      // brand click reloads the page list (simple reload)
      document.getElementById('brand').addEventListener('click', ()=>location.reload());

      // Restore last played if present
      try {
        const last = JSON.parse(localStorage.getItem('gamehub.last') || 'null');
        if (last && last.src) {
          // Optionally auto-load last played — comment out if undesired
          // deployApplication(last.src, last.title, last.glyph);
        }
      } catch(e){ /* ignore */ }

      // Accessibility: allow press Enter on brand (role=button)
      document.getElementById('brand').addEventListener('keydown', (ev)=>{
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); location.reload(); }
      });
    })();
  </script>
</body>
</html>
